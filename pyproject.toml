[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-handoff-skills"
version = "0.2.0"
description = "Portable SDK/protocol/CLI handoff skills for coding-agent harnesses"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Nate's Vibe Code"}]
license = {text = "MIT"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[tool.setuptools]
py-modules = ["harness_handoff_skills"]

# The fourteen handoff trees and standalone review skill package are GENERATED by
# scripts/build_skills.py. Do not hand-edit them; edit their authored sources and
# re-run the generator, then `--check` to prove the outputs are current.
[tool.setuptools.data-files]
"share/harness-handoff-skills" = ["README.md", "EVIDENCE.md"]
"share/harness-handoff-skills/scripts" = ["scripts/codex-task-bridge", "scripts/harness-control", "scripts/build_skills.py", "scripts/check_harness_sources.py", "scripts/extract_skill_sources.py", "scripts/session_review.py", "scripts/check_sdk_plans.py", "scripts/fetch_sdk_material.py"]
"share/harness-handoff-skills/mcp_bridge" = ["mcp_bridge/__init__.py", "mcp_bridge/contracts.py", "mcp_bridge/cli_executor.py", "mcp_bridge/sdk_executors.py", "mcp_bridge/server.py", "mcp_bridge/control.py", "mcp_bridge/ambiguity.py", "mcp_bridge/jev_worker.py", "mcp_bridge/recovery.py", "mcp_bridge/model_settings.py", "mcp_bridge/launch_plan.py", "mcp_bridge/sdk_bindings.json", "mcp_bridge/sdk_contract.py", "mcp_bridge/sdk_contract.mjs", "mcp_bridge/sdk_operations.py", "mcp_bridge/sdk_runner.py", "mcp_bridge/sdk_ts_adapters.mjs", "mcp_bridge/sdk_ts_runner.mjs"]
"share/harness-handoff-skills/skills-src" = ["skills-src/contracts.json", "skills-src/settings.json", "skills-src/session-review.md", "skills-src/session-review-output.schema.json"]
"share/harness-handoff-skills/docs" = ["docs/harness-control.md", "docs/access-profiles.md", "docs/launch-plans.md", "docs/connected-access-scope.md"]
"share/harness-handoff-skills/skills-src/harnesses" = ["skills-src/harnesses/amp.md", "skills-src/harnesses/antigravity.md", "skills-src/harnesses/claude.md", "skills-src/harnesses/cline.md", "skills-src/harnesses/codex.md", "skills-src/harnesses/copilot.md", "skills-src/harnesses/cursor.md", "skills-src/harnesses/droid.md", "skills-src/harnesses/gemini.md", "skills-src/harnesses/grok.md", "skills-src/harnesses/junie.md", "skills-src/harnesses/muse.md", "skills-src/harnesses/opencode.md", "skills-src/harnesses/openhands.md"]
